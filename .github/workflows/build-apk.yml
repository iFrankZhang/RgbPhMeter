name: 编译 APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: 编译（使用 runner 自带的 Android SDK）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - name: 失败时显示错误
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v5
        with:
          name: 比色读数仪-apk
          path: app/build/outputs/apk/release/*.apk
      - name: 发布到 Release（手机可直接下载）
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RgbPhMeter.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" RgbPhMeter.apk --title "比色读数仪 $TAG" --notes "安卓安装包。下载 RgbPhMeter.apk 后在手机上安装（需允许安装未知来源应用）。" --latest
